<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <rect width="320" height="220" fill="#EDE5D5"/>
  <rect y="168" width="320" height="52" fill="#D8CCB6"/>
  <!-- large box -->
  <g>
    <rect x="70" y="92" width="130" height="86" fill="#D9A441"/>
    <rect x="70" y="92" width="130" height="16" fill="#C4912F"/>
