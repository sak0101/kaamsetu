    <rect x="212" y="120" width="62" height="58" fill="none" stroke="#243B53" stroke-width="3"/>
  </g>
  <!-- tape roll -->
  <circle cx="44" cy="154" r="20" fill="#FBF8F1" stroke="#243B53" stroke-width="3"/>
  <circle cx="44" cy="154" r="8" fill="#EDE5D5" stroke="#243B53" stroke-width="3"/>
